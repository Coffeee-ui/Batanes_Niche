version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: batanes_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-batanes_niche}
      POSTGRES_USER: ${POSTGRES_USER:-batanes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-batanes_user} -d ${POSTGRES_DB:-batanes_niche}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - batanes_network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: batanes_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-batanes_user}:${POSTGRES_PASSWORD:-change_me_in_production}@db:5432/${POSTGRES_DB:-batanes_niche}
      PORT: 8000
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - batanes_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: batanes_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - batanes_network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  batanes_network:
    driver: bridge
